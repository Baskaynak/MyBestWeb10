# Starter pipeline zenginlestirilmis v6.0 (Azure DevOps CI + GitHub Pages CD)
trigger:
- main

# Her build'a tarih ve numara bazli kurumsal versiyon adi verir
name: $(Date:yyyyMMdd).$(Rev:r)

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  projectPath: 'MyBestWeb10/MyBestWeb10.csproj'
  artifactName: 'SuWeb-Ready-To-Deploy'
  githubRepo: 'Baskaynak/MyBestWeb10'

steps:

# [ANALIZ BASLANGICI] Sistem Kaynaklarini Izlemeyi Baslat
- script: |
    echo "=== PERFORMANS ANALIZI BASLADI ==="
    echo "##vso[task.logissue type=warning;]Sistem kaynak izlemesi aktif! 📊"
    df -h
    free -m
    lscpu | grep "Model name"
  displayName: '⚡ [Analiz] Sistem Ilk Durum Kontrolu'

# 1. Adim: .NET 10 Ortamini Hazirlama
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK (Preview)'
  inputs:
    packageType: 'sdk'
    version: '10.x'
    includePreviewVersions: true

# 2. Adim: Paketleri Cekme (Restore)
- task: DotNetCoreCLI@2
  displayName: 'Restore Dependencies'
  inputs:
    command: 'restore'
    projects: '$(projectPath)'

# 3. Adim: KATI KALITE KAPISI (Check Code Formatting)
- script: |
    echo "Kod format kalitesi denetleniyor..."
    dotnet format --verify-no-changes
  displayName: '🛡️ [QA Gate] Kod Standartlari Kontrolu'

# 4. Adim: Kodun Derlenmesi (Build) + Zaman Olcumu
- script: |
    echo "Build basliyor, kronometre acildi..."
    START_TIME=$(date +%s)
    
    dotnet build $(projectPath) --configuration $(buildConfiguration) --no-restore
    
    END_TIME=$(date +%s)
    ELAPSED=$((END_TIME - START_TIME))
    echo "Build Suresi: $ELAPSED saniye"
    echo "##vso[task.setvariable variable=BuildDuration]$ELAPSED"
  displayName: 'Build Project & Measure Time'

# 5. Adim: Yayina Hazirlama (Publish)
- task: DotNetCoreCLI@2
  displayName: 'Publish Artifacts'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/out'
    zipAfterPublish: false

# 6. Adim: Zip Paketi Olusturma (DevOps saklamasi icin)
- task: ArchiveFiles@2
  displayName: 'Zip Application Code'
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/out' 
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
    replaceExistingArchive: true

# 7. Adim: Ciktiyi DevOps Panelinde Saklama
- task: PublishBuildArtifacts@1
  displayName: 'Upload Zip to Azure DevOps Storage'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
    ArtifactName: '$(artifactName)'
    publishLocation: 'Container'

# [ANALIZ BITISI] Zenginlestirilmis Rapor Adimi (KORUNDU)
- script: |
    echo "=== PERFORMANS ANALIZI FINISH ==="
    USED_RAM=$(free -m | awk '/Mem:/ {print $3}')
    TOTAL_RAM=$(free -m | awk '/Mem:/ {print $2}')
    
    # Raporu hem ana ozet hem de Extensions sekmesi icin hazirla
    mkdir -p $(Build.ArtifactStagingDirectory)/summary
    
    echo "### 📊 SuWeb Pipeline v6.0 Kalite ve Performans Raporu" > $(Build.ArtifactStagingDirectory)/summary/SuWeb-Metrics.md
    echo "---" >> $(Build.ArtifactStagingDirectory)/summary/SuWeb-Metrics.md
    echo "| Metrik | Durum / Deger |" >> $(Build.ArtifactStagingDirectory)/summary/SuWeb-Metrics.md
    echo "| :--- | :--- |" >> $(Build.ArtifactStagingDirectory)/summary/SuWeb-Metrics.md
    echo "| ⏱️ **Toplam Build Suresi** | $(BuildDuration) saniye |" >> $(Build.ArtifactStagingDirectory)/summary/SuWeb-Metrics.md
    echo "| 🧠 **Harcanan Max Bellek** | $USED_RAM MB / $TOTAL_RAM MB |" >> $(Build.ArtifactStagingDirectory)/summary/SuWeb-Metrics.md
    echo "| 🛡️ **Kalite Kapisi Durumu** | Gecildi 🟢 |" >> $(Build.ArtifactStagingDirectory)/summary/SuWeb-Metrics.md
    
    cat $(Build.ArtifactStagingDirectory)/summary/SuWeb-Metrics.md
    
    # Hem ekrana bas hem de sisteme upload et
    echo "##vso[task.uploadsummary]$(Build.ArtifactStagingDirectory)/summary/SuWeb-Metrics.md"
  displayName: 'QA - Publish Performance Report'

# 🚀 9. Adim: CD Adimi (Klasor yollari nokta atisi duzeltildi)
- script: |
    echo "=== DAGITIM ENTEGRASYONU BASLADI ==="
    
    # 1. Temiz bir gecici klasor olustur
    mkdir -p $(Build.ArtifactStagingDirectory)/clean_pages
    
    # 2. Dosyalari ALT KLASORDEN (MyBestWeb10/) dogru yolla kopyala!
    cp $(Build.SourcesDirectory)/MyBestWeb10/index.html $(Build.ArtifactStagingDirectory)/clean_pages/
    cp $(Build.SourcesDirectory)/MyBestWeb10/hakkimda.html $(Build.ArtifactStagingDirectory)/clean_pages/
    
    # 3. wwwroot varliklarini kopyala
    if [ -d "$(Build.SourcesDirectory)/MyBestWeb10/wwwroot" ]; then
      cp -r $(Build.SourcesDirectory)/MyBestWeb10/wwwroot/* $(Build.ArtifactStagingDirectory)/clean_pages/ 2>/dev/null || true
    fi
    
    # 4. Temiz klasorun icine giris yap
    cd $(Build.ArtifactStagingDirectory)/clean_pages
    
    echo "=== GIDECEK DOSYALARIN NET LISTESI ==="
    ls -la
    
    # Git konfigurasyonlari ve zorlu push
    git config --global user.email "devops-agent@azure.com"
    git config --global user.name "Azure DevOps Agent"
    
    git init
    git checkout -b main
    git add .
    git commit -m "Deploy from Azure DevOps Pipeline v6.6 [Skip CI]"
    
    # GitHub gh-pages branch'ine tam yetkiyle bas
    git push --force "https://$(GitHubToken)@github.com/$(githubRepo).git" main:gh-pages
  displayName: '🚀 [CD] Uretilen Dosyalari GitHub Pages (gh-pages) Branchine Dagit'

# 10. Adim: Nazar Kalkani Logumuz (KORUNDU)
- script: echo 'SuWeb v6.0 Hibrit CI/CD Pipeline Basariyla Tamamlandi! 🧿🚀'
  displayName: 'Nazar Koruma Logu v6.0'
  # 💬 11. Adim: GitHub Commit Automation - Otomatik Durum Onay Botu
- script: |
    echo "=== GITHUB COMMIT ONAYI BASLIYOR ==="
    
    # GitHub API'sine gidip en son commit'in altina otomatik yorum yaziyoruz
    curl -X POST \
         -H "Authorization: token $(GitHubToken)" \
         -H "Accept: application/vnd.github.v3+json" \
         https://api.github.com/repos/$(githubRepo)/commits/$(Build.SourceVersion)/comments \
         -d '{
               "body": "### 🤖 SuWeb DevOps Agent Automation Report\n\n🚀 **CI/CD Pipeline Başarıyla Tamamlandı!**\n\n* **Build No:** '$(Build.BuildNumber)'\n* **Kalite Kapısı (QA Gate):** Geçildi 🟢\n* **Durum:** Canlıda Aktif! 🧿\n\n_Bu yorum Azure DevOps Pipeline tarafından otomatik olarak bırakılmıştır._"
             }'
  displayName: '💬 [Automation] Post Deployment Comment to GitHub Commit'
  condition: succeeded() # Sadece pipeline basariyla biterse bu yorumu yazar!