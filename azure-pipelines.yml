# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main
- feature/nazar-boncugu-v2

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:
# 1. .NET 10 SDK Kurulumu
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK (Preview)'
  inputs:
    packageType: 'sdk'
    version: '10.x'
    includePreviewVersions: true

# 2. Restore
- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: 'MyBestWeb10/MyBestWeb10.csproj'

# 3. Build
- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: 'MyBestWeb10/MyBestWeb10.csproj'
    arguments: '--configuration $(buildConfiguration)'

# 4. Publish (Otomatik olarak zip oluşturur)
- task: DotNetCoreCLI@2
  displayName: 'Publish'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'MyBestWeb10/MyBestWeb10.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: true # Bu satır çok önemli, kendi zipsinini kendi yapar

# 5. Azure Deployment (Paketi ararken daha geniş kapsamlı arıyoruz)
- task: AzureRmWebAppDeployment@4
  displayName: 'Deploy to Azure'
  inputs:
    ConnectionType: 'AzureRM'
    azureSubscription: 'MyAzureConn'
    appType: 'webAppLinux'
    WebAppName: 'BasicWeb'
    packageForLinux: '$(Build.ArtifactStagingDirectory)/**/*.zip'
- task: AzureRmWebAppDeployment@5
  inputs:
    ConnectionType: 'AzureRM'
    azureSubscription: 'MyAzureConn'
    appType: 'webAppLinux'
    WebAppName: 'BasicWeb'
    packageForLinux: '$(System.DefaultWorkingDirectory)/**/*.zip'
    RuntimeStack: 'DOTNETCORE|10.0'
    DeploymentTypeLinux: 'zipDeploy'

# 6. Azure Deployment (v5 versiyonu ve zipDeploy tipiyle)
- task: AzureRmWebAppDeployment@4
  displayName: 'Deploy to Azure'
  inputs:
    ConnectionType: 'AzureRM'
    azureSubscription: 'MyAzureConn'
    appType: 'webAppLinux'
    WebAppName: 'BasicWeb'
    packageForLinux: '$(Build.ArtifactStagingDirectory)/**/*.zip'
- task: AzureRmWebAppDeployment@5
  inputs:
    ConnectionType: 'AzureRM'
    azureSubscription: 'MyAzureConn'
    appType: 'webAppLinux'
    WebAppName: 'BasicWeb'
    packageForLinux: '$(System.DefaultWorkingDirectory)/**/*.zip'
    RuntimeStack: 'DOTNETCORE|10.0'
    DeploymentTypeLinux: 'zipDeploy'