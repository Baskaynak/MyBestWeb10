# Starter pipeline zenginleştirilmiş v6.0 (Azure DevOps CI + GitHub Pages CD)
trigger:
- main

# Her build'a tarih ve numara bazlı kurumsal versiyon adı verir
name: $(Date:yyyyMMdd).$(Rev:r)

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  projectPath: 'MyBestWeb10/MyBestWeb10.csproj'
  artifactName: 'SuWeb-Ready-To-Deploy'
  githubRepo: 'Baskaynak/MyBestWeb10'

steps:

# [ANALİZ BAŞLANGICI] Sistem Kaynaklarını İzlemeyi Başlat
- script: |
    echo "=== PERFORMANS ANALIZI BASLADI ==="
    echo "##vso[task.logissue type=warning;]Sistem kaynak izlemesi aktif! 📊"
    df -h
    free -m
    lscpu | grep "Model name"
  displayName: '⚡ [Analiz] Sistem İlk Durum Kontrolü'

# 1. Adım: .NET 10 Ortamını Hazırlama
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK (Preview)'
  inputs:
    packageType: 'sdk'
    version: '10.x'
    includePreviewVersions: true

# 2. Adım: Paketleri Çekme (Restore)
- task: DotNetCoreCLI@2
  displayName: 'Restore Dependencies'
  inputs:
    command: 'restore'
    projects: '$(projectPath)'

# 3. Adım: KATI KALİTE KAPISI (Check Code Formatting)
- script: |
    echo "Kod format kalitesi denetleniyor..."
    dotnet format --verify-no-changes
  displayName: '🛡️ [Kalite Kapısı] Kod Standartları Kontrolü'

# 4. Adım: Kodun Derlenmesi (Build) + Zaman Ölçümü
- script: |
    echo "Build basliyor, kronometre acildi..."
    START_TIME=$(date +%s)
    
    dotnet build $(projectPath) --configuration $(buildConfiguration) --no-restore
    
    END_TIME=$(date +%s)
    ELAPSED=$((END_TIME - START_TIME))
    echo "Build Suresi: $ELAPSED saniye"
    echo "##vso[task.setvariable variable=BuildDuration]$ELAPSED"
  displayName: 'Build Project & Measure Time'

# 5. Adım: Yayına Hazırlama (Publish)
- task: DotNetCoreCLI@2
  displayName: 'Publish Artifacts'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/out'
    zipAfterPublish: false

# 6. Adım: Zip Paketi Oluşturma (DevOps saklaması için)
- task: ArchiveFiles@2
  displayName: 'Zip Application Code'
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/out' 
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
    replaceExistingArchive: true

# 7. Adım: Çıktıyı DevOps Panelinde Saklama
- task: PublishBuildArtifacts@1
  displayName: 'Upload Zip to Azure DevOps Storage'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
    ArtifactName: '$(artifactName)'
    publishLocation: 'Container'

# [ANALİZ BİTİŞİ] Zenginleştirilmiş Rapor Adımı (KORUNDU)
- script: |
    echo "=== PERFORMANS ANALIZI FINISH ==="
    USED_RAM=$(free -m | awk '/Mem:/ {print $3}')
    TOTAL_RAM=$(free -m | awk '/Mem:/ {print $2}')
    
    echo "### 📊 SuWeb Pipeline v6.0 Kalite ve Performans Raporu" > $(Build.ArtifactStagingDirectory)/performance.md
    echo "---" >> $(Build.ArtifactStagingDirectory)/performance.md
    echo "| Metrik | Durum / Deger |" >> $(Build.ArtifactStagingDirectory)/performance.md
    echo "| :--- | :--- |" >> $(Build.ArtifactStagingDirectory)/performance.md
    echo "| ⏱️ **Toplam Build Suresi** | $(BuildDuration) saniye |" >> $(Build.ArtifactStagingDirectory)/performance.md
    echo "| 🧠 **Harcanan Max Bellek** | $USED_RAM MB / $TOTAL_RAM MB |" >> $(Build.ArtifactStagingDirectory)/performance.md
    echo "| 🛡️ **Kalite Kapısı Durumu** | Gecildi 🟢 |" >> $(Build.ArtifactStagingDirectory)/performance.md
    
    cat $(Build.ArtifactStagingDirectory)/performance.md
    echo "##vso[task.uploadsummary]$(Build.ArtifactStagingDirectory)/performance.md"
  displayName: '📊 [Analiz] Performans Raporunu Panele Yazdır'

# 🚀 9. Adım: KESİN VE GARANTİLİ CD ADIMI (Klasör Karmaşası Tamamen Çözüldü)
- script: |
    echo "=== DAĞITIM ENTEGRASYONU BAŞLADI ==="
    
    # 1. Tamamen bağımsız ve tertemiz bir geçici klasör oluştur
    mkdir -p $(Build.ArtifactStagingDirectory)/clean_pages
    
    # 2. Sadece ve sadece tarayıcının görmesini istediğimiz ana HTML dosyalarını buraya kopyala
    cp $(Build.SourcesDirectory)/index.html $(Build.ArtifactStagingDirectory)/clean_pages/
    cp $(Build.SourcesDirectory)/hakkimda.html $(Build.ArtifactStagingDirectory)/clean_pages/
    
    # 3. Eğer projede css/js klasörleri varsa onları da bu temiz klasörün içine taşı
    if [ -d "$(Build.SourcesDirectory)/MyBestWeb10/wwwroot" ]; then
      cp -r $(Build.SourcesDirectory)/MyBestWeb10/wwwroot/* $(Build.ArtifactStagingDirectory)/clean_pages/ 2>/dev/null || true
    fi
    
    # 4. Temiz klasörün içine giriş yap
    cd $(Build.ArtifactStagingDirectory)/clean_pages
    
    echo "=== GİDECEK DOSYALARIN NET LİSTESİ ==="
    ls -la
    
    # Git konfigürasyonları ve zorlu push
    git config --global user.email "devops-agent@azure.com"
    git config --global user.name "Azure DevOps Agent"
    
    git init
    git checkout -b main
    git add .
    git commit -m "Deploy from Azure DevOps Pipeline v6.5 [Skip CI]"
    
    # GitHub gh-pages branch'ini tamamen sıfırlayıp sadece bu temiz dosyaları basıyoruz
    git push --force "https://$(GitHubToken)@github.com/$(githubRepo).git" main:gh-pages
  displayName: '🚀 [CD] Üretilen Dosyaları GitHub Pages (gh-pages) Branchine Dağıt'
# 10. Adım: Nazar Kalkanı Logumuz (KORUNDU)
- script: echo 'SuWeb v6.0 Hibrit CI/CD Pipeline Başarıyla Tamamlandı! 🧿🚀'
  displayName: 'Nazar Koruma Logu v6.0'