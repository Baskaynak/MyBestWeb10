# Starter pipeline zenginleştirilmiş v2 sürümü
trigger:
- main

# Her build'a tarih ve numara bazlı kurumsal versiyon adı verir (Örn: 20260607.1)
name: $(Date:yyyyMMdd).$(Rev:r)

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:

# [ANALİZ BAŞLANGICI] Sistem Kaynaklarını İzlemeyi Başlat
- script: |
    echo "=== PERFORMANS ANALIZI BASLADI ==="
    echo "##vso[task.logissue type=warning;]Sistem kaynak izlemesi aktif! 📊"
    df -h
    free -m
    lscpu | grep "Model name"
  displayName: '⚡ [Analiz] Sistem İlk Durum Kontrolü'

# 1. Adım: .NET 10 Ortamını Hazırlama
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK (Preview)'
  inputs:
    packageType: 'sdk'
    version: '10.x'
    includePreviewVersions: true

# 2. Adım: Paketleri Çekme (Restore)
- task: DotNetCoreCLI@2
  displayName: 'Restore Dependencies'
  inputs:
    command: 'restore'
    projects: 'MyBestWeb10/MyBestWeb10.csproj'

# 3. Adım: Kod Format Kontrolü (Yeni Eklendi!)
- script: dotnet format --verify-no-changes
  displayName: 'Check Code Formatting'

# 4. Adım: Kodun Derlenmesi (Build) + Zaman Ölçümü
- script: |
    echo "Build basliyor, kronometre acildi..."
    START_TIME=$(date +%s)
    
    dotnet build MyBestWeb10/MyBestWeb10.csproj --configuration $(buildConfiguration) --no-restore
    
    END_TIME=$(date +%s)
    ELAPSED=$((END_TIME - START_TIME))
    echo "Build Suresi: $ELAPSED saniye"
    echo "##vso[task.setvariable variable=BuildDuration]$ELAPSED"
  displayName: 'Build Project & Measure Time'

# 5. Adım: Yayına Hazırlama (Publish)
- task: DotNetCoreCLI@2
  displayName: 'Publish Artifacts'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '**/MyBestWeb10.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: false

# 6. Adım: Zip Paketi Oluşturma
- task: ArchiveFiles@2
  displayName: 'Zip Application Code'
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)' 
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
    replaceExistingArchive: true

# 7. Adım: Çıktıyı DevOps Panelinde Saklama (Yeni Eklendi!)
- task: PublishBuildArtifacts@1
  displayName: 'Upload Zip to Azure DevOps Storage'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
    ArtifactName: 'SuWeb-Ready-To-Deploy'
    publishLocation: 'Container'

# [ANALİZ BİTİŞİ] Şık Bir Markdown Özeti Oluşturup DevOps Özet Paneline Çakma!
- script: |
    echo "=== PERFORMANS ANALIZI FINISH ==="
    echo "### 📊 SuWeb Pipeline Performans Analiz Raporu" > $(Build.ArtifactStagingDirectory)/performance.md
    echo "---" >> $(Build.ArtifactStagingDirectory)/performance.md
    echo "| Metrik | Durum / Deger |" >> $(Build.ArtifactStagingDirectory)/performance.md
    echo "| :--- | :--- |" >> $(Build.ArtifactStagingDirectory)/performance.md
    echo "| ⏱️ **Toplam Build Suresi** | \$(BuildDuration) saniye |" >> $(Build.ArtifactStagingDirectory)/performance.md
    echo "| 🧠 **Harcanan Max Bellek** | \$(free -m | awk '/Mem:/ {print \$3}') MB / \$(free -m | awk '/Mem:/ {print \$2}') MB |" >> $(Build.ArtifactStagingDirectory)/performance.md
    echo "| 🚀 **Ajan Durumu** | Tam Gaz Aktif 🟢 |" >> $(Build.ArtifactStagingDirectory)/performance.md
    echo "##vso[task.uploadsummary]$(Build.ArtifactStagingDirectory)/performance.md"
  displayName: '📊 [Analiz] Performans Raporunu Panele Yazdır'

# 8. Adım: Nazar Kalkanı Logumuz
- script: echo 'SuWeb v3 Performance Pipeline Tamamlandi! Grafiksel veriler hazir! 2026 DevOps Style! **Harfi Harfine Başarıldı!** 🧿🚀'
  displayName: 'Nazar Koruma Logu v3'

