# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

# BURASI EKLENDİ: Değişken tanımı tam olarak bu hizada olmalı
variables:
  buildConfiguration: 'Release'

steps:

# .NET 10 SDK Kurulumu
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    version: '10.x'
    includePreviewVersions: true

# Proje Derleme (Build) Adımı
- task: DotNetCoreCLI@2
  displayName: 'Build Project'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--configuration $(buildConfiguration)'

# Yayınlama ve Paketleme (Publish)
- task: DotNetCoreCLI@2
  displayName: 'Build and Publish Project'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '**/MyBestWeb10.csproj' 
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: true

# Azure App Service'e Dağıtım (Deploy)
- task: AzureRmWebAppDeployment@4
  displayName: 'Deploy to Azure App Service'
  inputs:
    ConnectionType: 'AzureRM'
    azureSubscription: 'MyAzureConn'        
    appType: 'webAppLinux'
    WebAppName: 'BasicWeb'                  
    packageForLinux: '$(Build.ArtifactStagingDirectory)/**/*.zip'


