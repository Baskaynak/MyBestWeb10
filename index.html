<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuWeb Dünyası</title>
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .nazar {
            font-size: 4rem;
            display: inline-block;
            animation: don 4s infinite linear;
        }
        p {
            color: #7f8c8d;
            font-size: 1.2rem;
        }
        @keyframes don {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="nazar">🧿</div>
        <h1>SuWeb Dünyası Canlıda!</h1>
        <p>O inatçı 404 canavarını resmen tarihe gömdük aşko! 🚀</p>
    </div>
</body>
</html>
